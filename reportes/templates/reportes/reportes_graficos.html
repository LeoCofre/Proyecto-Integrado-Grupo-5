{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Reportes</h2>

    {% include 'reportes/filtros_form.html' %}

    <a href="{% url 'exportar_excel' %}" class="btn btn-success mb-3">Exportar Excel</a>

    <canvas id="chartRN" width="400" height="200"></canvas>
</div>

<script id="labels-data"
    type="application/json">[{% for r in rn_por_sexo %}"{{ r.sexo }}"{% if not forloop.last %}, {% endif %}{% endfor %}]</script>
<script id="values-data"
    type="application/json">[{% for r in rn_por_sexo %}{{ r.total }}{% if not forloop.last %}, {% endif %}{% endfor %}]</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const labels = JSON.parse(document.getElementById('labels-data').textContent);
    const dataVals = JSON.parse(document.getElementById('values-data').textContent);
    const ctx = document.getElementById('chartRN').getContext('2d');
    const data = {
        labels: labels,
        datasets: [{
            label: 'Recién Nacidos filtrados por sexo',
            data: dataVals,
            backgroundColor: ['#36A2EB', '#FF6384', '#FFCE56']
        }]
    };
    const chartRN = new Chart(ctx, {
        type: 'bar',
        data: data
    });
</script>
{% endblock %}
